# Shared configuration served by config-server to every client service.
# Service-specific files (<spring.application.name>.yml) override these values.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
