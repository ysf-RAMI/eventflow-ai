server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    # Pulls shared and gateway settings from config-server; starts without it if unavailable.
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      routes:
        # lb://<name> resolves instances through Eureka (names = spring.application.name).
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/events/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**,/api/seats/**,/api/holds/**
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**
        # payment-service is internal (/internal/payments) and called only by booking-service.
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${FRONTEND_URL:http://localhost:4200}
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: "*"
            allow-credentials: true

eventflow:
  security:
    jwt-enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway
