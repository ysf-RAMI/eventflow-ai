spring.application.name=booking-service
spring.profiles.active=local

spring.datasource.url=jdbc:h2:file:./data/bookingdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

inventory-service.url=http://localhost:8082
payment-service.url=http://localhost:8084

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=booking-service-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=MODERN
spring.ai.mcp.server.modern.mcp-endpoint=/mcp
