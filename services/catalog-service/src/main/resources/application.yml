server:
  port: 8081

spring:
  application:
    name: catalog-service
  cloud:
    openfeign:
      client:
        config:
          default:
              connect-timeout: 2000
              read-timeout: 5000
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_db
    username: eventflow
    password: eventflow_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info


inventory:
  base-url: http://localhost:8082